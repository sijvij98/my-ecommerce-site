<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-Commerce Site</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">ShopLogo</div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        <div class="cart-icon" id="cart-icon" aria-label="Open Cart">
            🛒 <span id="cart-count">0</span>
        </div>
    </header>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button id="close-cart" class="close-btn" aria-label="Close Cart">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Cart items will be injected here dynamically -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">Total: $<span id="total-price">0.00</span></div>
            <button id="checkout-btn" class="checkout-btn">Checkout</button>
        </div>
    </div>
    <div id="cart-overlay" class="cart-overlay"></div>

    <main>
        <section id="home" class="hero">
            <h1>Welcome to Our Store</h1>
            <p>Discover the best products at unbeatable prices.</p>
            <button id="shop-now-btn">Shop Now</button>
        </section>

        <section id="products" class="products">
            <h2>Featured Products</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Product 1">
                    <h3>Product 1</h3>
                    <p>$19.99</p>
                    <button class="add-to-cart" data-id="1" data-name="Product 1" data-price="19.99" data-image="https://via.placeholder.com/150">Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Product 2">
                    <h3>Product 2</h3>
                    <p>$29.99</p>
                    <button class="add-to-cart" data-id="2" data-name="Product 2" data-price="29.99" data-image="https://via.placeholder.com/150">Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Product 3">
                    <h3>Product 3</h3>
                    <p>$39.99</p>
                    <button class="add-to-cart" data-id="3" data-name="Product 3" data-price="39.99" data-image="https://via.placeholder.com/150">Add to Cart</button>
                </div>
            </div>
        </section>
    </main>

    <footer id="contact">
        <p>&copy; 2026 My E-Commerce Site. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
